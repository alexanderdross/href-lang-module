name: 'Hreflang Cross-Backend'
type: module
description: 'Cross-backend hreflang for a family of independent, path-prefixed Drupal backends. Umbrella package for the client and hub submodules.'
package: 'SEO'
core_version_requirement: '^10.3 || ^11'
# This umbrella has no code of its own. Enable the submodules you need:
#   - hrefl_client: install on every backend (collector + emitters + selector).
#   - hrefl_hub:    install on the Global backend only (registry + mapping engine + API).
# See docs/ (shipped with this package) for the full concept.
